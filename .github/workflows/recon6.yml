name: 'Recon 6 (round/voice once: close and delete points)'

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Survey code (part 6)
        run: |
          set +e
          J=TMessagesProj/src/main/java/org/telegram
          CA=$J/ui/ChatActivity.java
          MC=$J/messenger/MediaController.java
          sec() { echo; echo "######## $*"; }
          around() { L=$(grep -n -E "$2" "$1" | head -1 | cut -d: -f1); if [ -n "$L" ]; then echo "--- $1 @ $L"; sed -n "$((L-$3)),$((L+$4))p" "$1"; else echo "--- NOT FOUND: $2 in $1"; fi; }

          sec "sendSecretMediaDelete / sendSecretMessageRead"
          grep -n "Runnable sendSecretMediaDelete\|Runnable sendSecretMessageRead\|void sendSecretMediaDelete\|void sendSecretMessageRead" $CA
          around $CA "sendSecretMediaDelete\(MessageObject" 1 35
          around $CA "sendSecretMessageRead\(MessageObject" 1 35

          sec "ChatActivity around line 15794 (round/voice once open)"
          around $CA "isOutOwner\(\) \|\| !messageObject.isRoundOnce\(\) && !messageObject.isVoiceOnce\(\)" 20 40

          sec "ChatActivity around line 30802 (round/voice once)"
          around $CA "messageObject.isRoundOnce\(\) \|\| messageObject.isVoiceOnce\(\)\) \{" 15 30

          sec "ChatActivity around line 39747"
          around $CA "messageObject.isVoiceOnce\(\) \|\| messageObject.isRoundOnce\(\)\) \{" 15 30

          sec "MediaController: once playback and deletion"
          grep -n "isVoiceOnce\|isRoundOnce\|playMessage\|markAsPlayedMessage\|destroyMessage\|onVoiceOnceFinished" $MC | head -40
          around $MC "public void markAsPlayedMessage\(" 2 30
